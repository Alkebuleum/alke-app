<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ALKÉ Network App</title>
    <meta name="description" content="The ALKÉ Network app: one tap a day to mine, ALKÉ Hex and ALKÉ Rush, and invites that warm cold ALKE." />
    <meta name="theme-color" content="#08070D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/SpaceGrotesk.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/JetBrainsMono.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <!-- Restores the real path after the GitHub Pages 404.html SPA redirect. -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get("redirect");
        if (redirect) window.history.replaceState(null, "", "/" + redirect);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
